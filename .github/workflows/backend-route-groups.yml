name: Backend route groups

on:
  workflow_dispatch:
  push:
    branches:
      - codex/route-group-control
  pull_request:
    paths:
      - 'backend/**'
      - 'admin/**'
      - '.github/workflows/backend-route-groups.yml'

permissions:
  contents: read

jobs:
  backend-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hoaxconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hoaxconnect_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      HC_STAGE2C_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/hoaxconnect_test
      HC_STAGE2D_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/hoaxconnect_test
      HC_STAGE2F_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/hoaxconnect_test
      HC_STAGE5_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/hoaxconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - run: node --import tsx --test --test-concurrency=1 tests/*.test.ts
        working-directory: backend

  admin-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:admin
