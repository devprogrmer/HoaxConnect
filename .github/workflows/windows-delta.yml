name: Windows update delta

on:
  workflow_run:
    workflows:
      - Windows
    types:
      - completed
    branches:
      - codex/**
  push:
    paths:
      - .github/workflows/windows-delta.yml
      - scripts/measure-windows-delta.mjs
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Windows installer workflow run ID
        required: true
        default: "45558249447"

permissions:
  actions: read
  contents: read

jobs:
  measure:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run || github.event.workflow_run.id || '45558249447' }}
          name: HoaxConnect-Windows-x64
          path: candidate
      - name: Compare with the 0.4.0 baseline
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://hoaxnet.ir/updates/HoaxConnect-0.4.0-Setup.exe.blockmap \
            --output baseline.blockmap
          node scripts/measure-windows-delta.mjs \
            baseline.blockmap \
            candidate/HoaxConnect-0.4.1-Setup.exe.blockmap \
            15000000
